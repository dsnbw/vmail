<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href="/admin/" />
  <title>Vmail Admin Console</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./app.css?v=20261112r3" />
</head>
<body>
  <div id="login-screen" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">
        <img src="./favicon.svg" alt="Vmail" />
        <div>
          <h1>Vmail Server</h1>
          <p>Bảng điều khiển Mail Server mã nguồn mở · Miễn phí trọn đời</p>
        </div>
      </div>
      <form id="login-form">
        <label>Tài khoản quản trị</label>
        <input id="login-user" type="text" placeholder="admin@domain.com" autocomplete="username" required />
        <label>Mật khẩu</label>
        <input id="login-pass" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
        <div id="login-err" class="err-box hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Đăng nhập Vmail</button>
      </form>
      <div class="login-footer">
        <a href="/" target="_self">← Quay lại Webmail Gmail UI</a>
      </div>
    </div>
  </div>

  <div id="app-shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="./favicon.svg" alt="Vmail" />
        <div>
          <div class="brand-name">Vmail</div>
          <div class="brand-sub">Open Mail Engine</div>
        </div>
      </div>
      <nav class="nav" id="nav-menu">
        <button class="nav-item active" data-tab="overview"><span>📊</span>Tổng quan</button>
        <button class="nav-item" data-tab="domains"><span>🌐</span>Tên miền &amp; DNS</button>
        <button class="nav-item" data-tab="accounts"><span>👤</span>Hộp thư &amp; Alias</button>
        <button class="nav-item" data-tab="relays"><span>🚀</span>SMTP Relay &amp; Test</button>
        <button class="nav-item" data-tab="apikeys"><span>🔑</span>Transactional API</button>
        <button class="nav-item" data-tab="marketing"><span>📣</span>Danh bạ &amp; Chiến dịch</button>
        <button class="nav-item" data-tab="spam"><span>🛡️</span>Chống Spam &amp; Chạy kín</button>
        <button class="nav-item" data-tab="logs"><span>📜</span>Nhật ký &amp; Hàng đợi</button>
      </nav>
      <div class="sidebar-bottom">
        <a class="btn btn-ghost btn-block" href="/" target="_blank">📬 Mở Webmail (Gmail UI)</a>
        <button class="btn btn-ghost btn-block" id="logout-btn">Đăng xuất</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="page-title">Tổng quan hệ thống</h2>
          <div id="page-sub" class="muted">Quản trị toàn diện · Gọn nhẹ · Miễn phí trọn đời</div>
        </div>
        <div class="topbar-actions">
          <span class="badge badge-ok" id="top-route-badge">Route: ...</span>
          <span class="user-pill" id="top-user">admin</span>
        </div>
      </header>

      <section id="tab-overview" class="tab-view"></section>
      <section id="tab-domains" class="tab-view hidden"></section>
      <section id="tab-accounts" class="tab-view hidden"></section>
      <section id="tab-relays" class="tab-view hidden"></section>
      <section id="tab-apikeys" class="tab-view hidden"></section>
      <section id="tab-marketing" class="tab-view hidden"></section>
      <section id="tab-spam" class="tab-view hidden"></section>
      <section id="tab-logs" class="tab-view hidden"></section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">Chi tiết</h3>
        <button class="icon-btn" id="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>
  <script src="./app.js?v=20261112r3"></script>
</body>
</html>
